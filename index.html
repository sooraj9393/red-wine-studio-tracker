<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Wine Studio - Event Management</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase JS SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-10 shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-wine-glass-empty text-red-500 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">Red Wine Studio</h1>
            </div>
            <button onclick="openModal()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 shadow-md hover:shadow-red-900/30">
                <i class="fa-solid fa-plus"></i> Add Event
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 mt-8">
        <!-- Event Stats / Realtime Indicator -->
        <div class="flex justify-between items-center mb-6 bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
            <div>
                <h2 class="text-2xl font-bold">Upcoming Events</h2>
                <p class="text-sm text-slate-400">Live synchronized event schedule</p>
            </div>
            <div id="status-badge" class="flex items-center gap-2 px-3 py-1 bg-amber-500/10 text-amber-400 rounded-full text-xs font-semibold border border-amber-500/20">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                Connecting to Database...
            </div>
        </div>

        <!-- Event Grid -->
        <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading State Placeholder -->
            <div class="col-span-full text-center py-12 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
                <p>Loading realtime events...</p>
            </div>
        </div>
    </main>

    <!-- Add/Edit Event Modal -->
    <div id="event-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 rounded-2xl max-w-md w-full p-6 border border-slate-700 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 id="modal-title" class="text-xl font-bold mb-4">Add New Event</h3>
            
            <form id="event-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="event-id">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Event Title</label>
                    <input type="text" id="event-title" required placeholder="e.g. Live Acoustic Night" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Date</label>
                        <input type="date" id="event-date" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Time</label>
                        <input type="time" id="event-time" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Location / Stage</label>
                    <input type="text" id="event-location" required placeholder="e.g. Studio A / Main Stage" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Description</label>
                    <textarea id="event-description" rows="3" placeholder="Additional details..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-500"></textarea>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-medium text-slate-300">Cancel</button>
                    <button type="submit" id="submit-btn" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg font-medium text-white">Save Event</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Logic Script -->
    <script>
        // 1. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDD6KHNyFKhZBisGh8MJNnnKG6p9TjrHOY",
            authDomain: "red-wine-studio.firebaseapp.com",
            projectId: "red-wine-studio",
            storageBucket: "red-wine-studio.firebasestorage.app",
            messagingSenderId: "225688453076",
            appId: "1:225688453076:web:f51c533b759f944c602041",
            measurementId: "G-4SZB4YHF1Z"
        };

        // 2. Initialize Firebase & Firestore
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 3. Elements
        const eventsGrid = document.getElementById('events-grid');
        const statusBadge = document.getElementById('status-badge');
        const modal = document.getElementById('event-modal');
        const form = document.getElementById('event-form');

        // 4. Listen for Realtime Updates from Firestore
        db.collection('events').orderBy('date', 'asc').onSnapshot((snapshot) => {
            // Update Connection Status
            statusBadge.className = "flex items-center gap-2 px-3 py-1 bg-emerald-500/10 text-emerald-400 rounded-full text-xs font-semibold border border-emerald-500/20";
            statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Sync Active`;

            if (snapshot.empty) {
                eventsGrid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-500 bg-slate-800/30 rounded-xl border border-dashed border-slate-700">
                        <i class="fa-regular fa-calendar-xmark text-4xl mb-3 block"></i>
                        <p class="text-lg font-medium">No events scheduled yet.</p>
                        <p class="text-sm text-slate-400">Click "Add Event" above to create your first event.</p>
                    </div>`;
                return;
            }

            eventsGrid.innerHTML = '';
            snapshot.forEach((doc) => {
                const event = doc.data();
                const id = doc.id;
                eventsGrid.appendChild(createEventCard(id, event));
            });
        }, (error) => {
            console.error("Firestore sync error:", error);
            statusBadge.className = "flex items-center gap-2 px-3 py-1 bg-red-500/10 text-red-400 rounded-full text-xs font-semibold border border-red-500/20";
            statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> Connection Error`;
        });

        // 5. Card Component Builder
        function createEventCard(id, data) {
            const card = document.createElement('div');
            card.className = "bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg flex flex-col justify-between hover:border-slate-600 transition";
            card.innerHTML = `
                <div>
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="font-bold text-lg text-white leading-snug">${escapeHtml(data.title)}</h3>
                        <div class="flex gap-2">
                            <button onclick="editEvent('${id}', '${escapeHtml(data.title)}', '${data.date}', '${data.time}', '${escapeHtml(data.location)}', '${escapeHtml(data.description || '')}')" class="text-slate-400 hover:text-amber-400 text-sm p-1">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteEvent('${id}')" class="text-slate-400 hover:text-red-400 text-sm p-1">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <p class="text-slate-300 text-sm mb-4 line-clamp-3">${escapeHtml(data.description || 'No description provided.')}</p>
                </div>
                <div class="border-t border-slate-700/60 pt-3 space-y-1 text-xs text-slate-400">
                    <div class="flex items-center gap-2">
                        <i class="fa-regular fa-calendar text-red-400 w-4"></i>
                        <span>${data.date} at ${data.time}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-location-dot text-red-400 w-4"></i>
                        <span>${escapeHtml(data.location)}</span>
                    </div>
                </div>
            `;
            return card;
        }

        // 6. Form Handlers & Database Writes
        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('event-id').value;
            const eventData = {
                title: document.getElementById('event-title').value,
                date: document.getElementById('event-date').value,
                time: document.getElementById('event-time').value,
                location: document.getElementById('event-location').value,
                description: document.getElementById('event-description').value,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (id) {
                    await db.collection('events').doc(id).update(eventData);
                } else {
                    eventData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('events').add(eventData);
                }
                closeModal();
            } catch (err) {
                alert("Error saving event: " + err.message);
            }
        }

        async function deleteEvent(id) {
            if (confirm("Are you sure you want to delete this event?")) {
                try {
                    await db.collection('events').doc(id).delete();
                } catch (err) {
                    alert("Error deleting event: " + err.message);
                }
            }
        }

        // 7. UI Controls (Modal Opens & Edits)
        function openModal() {
            form.reset();
            document.getElementById('event-id').value = '';
            document.getElementById('modal-title').innerText = 'Add New Event';
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

        function editEvent(id, title, date, time, location, description) {
            document.getElementById('event-id').value = id;
            document.getElementById('event-title').value = title;
            document.getElementById('event-date').value = date;
            document.getElementById('event-time').value = time;
            document.getElementById('event-location').value = location;
            document.getElementById('event-description').value = description;
            document.getElementById('modal-title').innerText = 'Edit Event';
            modal.classList.remove('hidden');
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
