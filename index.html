<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Wine Studio - Event & Payment Management</title>
  <style>
    /* Global Dark Theme Baseline */
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
    }

    .modal-content.dark-theme {
      background-color: #1e293b;
      margin: 5% auto;
      padding: 24px;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 90%;
      max-width: 650px;
      color: #f8fafc;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .close-btn {
      float: right;
      font-size: 24px;
      font-weight: bold;
      color: #94a3b8;
      cursor: pointer;
    }
    .close-btn:hover { color: #ffffff; }

    /* Form Controls */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .form-control {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #ffffff;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: #ef4444;
    }

    /* Buttons */
    .btn {
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary { background-color: #dc2626; color: #ffffff; }
    .btn-primary:hover { background-color: #b91c1c; }

    .btn-secondary { background-color: #334155; color: #cbd5e1; }
    .btn-secondary:hover { background-color: #475569; }

    .btn-danger-outline {
      background-color: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
    }
    .btn-danger-outline:hover {
      background-color: rgba(239, 68, 68, 0.1);
    }

    /* Table & Progress Bars */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }

    th {
      background-color: #0f172a;
      color: #94a3b8;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .progress-track {
      background-color: #334155;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
      width: 120px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .bg-green { background-color: #22c55e; }
    .bg-blue { background-color: #3b82f6; }
    .bg-red { background-color: #ef4444; }
  </style>
</head>
<body>

  <h2>Red Wine Studio - Events Ledger</h2>

  <!-- Main Events Table -->
  <table>
    <thead>
      <tr>
        <th>Event Name</th>
        <th>Wedding Date</th>
        <th>Event Progress</th>
        <th>Payment Progress</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="eventsTableBody">
      <!-- Dynamic rows will render here -->
    </tbody>
  </table>

  <!-- Main Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content dark-theme">
      <span class="close-btn" onclick="closeEditModal()">&times;</span>
      <h3>Edit Event & Payment Ledger</h3>

      <div class="form-grid">
        <div class="form-group">
          <label>Booking Date (Created Date)</label>
          <input type="date" id="editBookingDate" class="form-control" />
        </div>

        <div class="form-group">
          <label>Event Name</label>
          <input type="text" id="editEventName" class="form-control" />
        </div>

        <div class="form-group">
          <label>Status Progress</label>
          <select id="editStatusProgress" class="form-control">
            <option value="BOOKED">BOOKED</option>
            <option value="PRE_WED_DONE">PRE-WED DONE</option>
            <option value="WEDDING_DONE">WEDDING DONE</option>
            <option value="ALBUM_DELIVERED">ALBUM DELIVERED</option>
            <option value="DELIVERED">DELIVERED</option>
            <option value="CANCELLED">CANCELLED</option>
          </select>
        </div>

        <div class="form-group">
          <label>Camera Team</label>
          <input type="text" id="editCameraTeam" class="form-control" placeholder="Camera Team details" />
        </div>

        <div class="form-group">
          <label>Wedding Date</label>
          <input type="date" id="editWeddingDate" class="form-control" />
        </div>

        <div class="form-group">
          <label>Pre-Wed Shoot Date</label>
          <input type="date" id="editPreWedDate" class="form-control" />
        </div>

        <div class="form-group">
          <label>Album Due Date</label>
          <input type="date" id="editAlbumDueDate" class="form-control" />
        </div>

        <div class="form-group">
          <label>Video Due Date</label>
          <input type="date" id="editVideoDueDate" class="form-control" />
        </div>

        <div class="form-group">
          <label>Overall Cost (Rs.)</label>
          <input type="number" id="editOverallCost" class="form-control" />
        </div>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 24px;">
        <button type="button" class="btn btn-danger-outline" onclick="openCancelModal()">🚫 Cancel Event</button>
        <button type="button" class="btn btn-primary" style="flex: 1;" onclick="saveEventAndSync()">Update Event & Sync Cloud</button>
      </div>
    </div>
  </div>

  <!-- Cancel Event Reason Popup Modal -->
  <div id="cancelModal" class="modal">
    <div class="modal-content dark-theme" style="max-width: 450px;">
      <span class="close-btn" onclick="closeCancelModal()">&times;</span>
      <h3 style="color: #ef4444; margin-top: 0;">Cancel Event</h3>
      <p style="color: #94a3b8; font-size: 0.9rem;">Please enter the reason for cancelling this event:</p>

      <div class="form-group">
        <textarea id="cancelReasonInput" class="form-control" rows="4" placeholder="Enter reason for cancellation..."></textarea>
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
        <button class="btn btn-secondary" onclick="closeCancelModal()">Keep Event</button>
        <button class="btn btn-primary" onclick="confirmCancelEvent()">Confirm Cancellation</button>
      </div>
    </div>
  </div>

  <script>
    // Sample Data Store
    let events = [
      {
        id: "evt_1",
        eventName: "Kalki",
        weddingDate: "2026-08-26",
        bookingDate: "2026-08-08",
        status: "BOOKED",
        cameraTeam: "Team Alpha",
        preWedDate: "2026-08-24",
        albumDueDate: "2026-09-27",
        videoDueDate: "2026-09-27",
        overallCost: 50000,
        totalPaid: 20000
      }
    ];

    let currentEditingId = null;

    // Load Table Rows
    function renderTable() {
      const tbody = document.getElementById('eventsTableBody');
      tbody.innerHTML = '';

      events.forEach(evt => {
        const statusPct = getStatusProgressPercentage(evt.status);
        const paymentPct = getPaymentProgressPercentage(evt.totalPaid, evt.overallCost);

        const isCancelled = evt.status === 'CANCELLED';
        const statusBarColor = isCancelled ? 'bg-red' : 'bg-blue';
        const paymentBarColor = paymentPct === 100 ? 'bg-green' : 'bg-blue';

        tbody.innerHTML += `
          <tr>
            <td><strong>${evt.eventName}</strong></td>
            <td>${evt.weddingDate || 'N/A'}</td>
            
            <!-- Event Progress Bar -->
            <td>
              <div style="font-size: 0.85rem; font-weight: 600;">${evt.status}</div>
              <div class="progress-track">
                <div class="progress-fill ${statusBarColor}" style="width: ${statusPct}%;"></div>
              </div>
              <span style="font-size: 0.75rem; color: #94a3b8;">${statusPct}% Completed</span>
            </td>

            <!-- Payment Progress Bar -->
            <td>
              <div style="font-size: 0.85rem;">Rs. ${evt.totalPaid} / ${evt.overallCost}</div>
              <div class="progress-track">
                <div class="progress-fill ${paymentBarColor}" style="width: ${paymentPct}%;"></div>
              </div>
              <span style="font-size: 0.75rem; color: #94a3b8;">${paymentPct}% Paid</span>
            </td>

            <td>
              <button class="btn btn-secondary" onclick="openEditModal('${evt.id}')">Edit</button>
            </td>
          </tr>
        `;
      });
    }

    // Helper Progress Calculations
    function getStatusProgressPercentage(status) {
      const mapping = {
        'BOOKED': 20,
        'PRE_WED_DONE': 40,
        'WEDDING_DONE': 60,
        'ALBUM_DELIVERED': 80,
        'DELIVERED': 100,
        'CANCELLED': 0
      };
      return mapping[status] || 0;
    }

    function getPaymentProgressPercentage(paid, total) {
      if (!total || total <= 0) return 0;
      const pct = Math.round((paid / total) * 100);
      return Math.min(pct, 100);
    }

    // Modal Handlers
    function openEditModal(id) {
      currentEditingId = id;
      const evt = events.find(e => e.id === id);

      document.getElementById('editBookingDate').value = evt.bookingDate || '';
      document.getElementById('editEventName').value = evt.eventName || '';
      document.getElementById('editStatusProgress').value = evt.status || 'BOOKED';
      document.getElementById('editCameraTeam').value = evt.cameraTeam || '';
      document.getElementById('editWeddingDate').value = evt.weddingDate || '';
      document.getElementById('editPreWedDate').value = evt.preWedDate || '';
      document.getElementById('editAlbumDueDate').value = evt.albumDueDate || '';
      document.getElementById('editVideoDueDate').value = evt.videoDueDate || '';
      document.getElementById('editOverallCost').value = evt.overallCost || 0;

      document.getElementById('editModal').style.display = 'block';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    function saveEventAndSync() {
      const evt = events.find(e => e.id === currentEditingId);
      
      evt.bookingDate = document.getElementById('editBookingDate').value;
      evt.eventName = document.getElementById('editEventName').value;
      evt.status = document.getElementById('editStatusProgress').value;
      evt.cameraTeam = document.getElementById('editCameraTeam').value;
      evt.weddingDate = document.getElementById('editWeddingDate').value;
      evt.preWedDate = document.getElementById('editPreWedDate').value;
      evt.albumDueDate = document.getElementById('editAlbumDueDate').value;
      evt.videoDueDate = document.getElementById('editVideoDueDate').value;
      evt.overallCost = parseFloat(document.getElementById('editOverallCost').value) || 0;

      // Add Firebase Firestore Sync Here:
      // await db.collection('events').doc(currentEditingId).update(evt);

      closeEditModal();
      renderTable();
    }

    function openCancelModal() {
      document.getElementById('cancelReasonInput').value = '';
      document.getElementById('cancelModal').style.display = 'block';
    }

    function closeCancelModal() {
      document.getElementById('cancelModal').style.display = 'none';
    }

    function confirmCancelEvent() {
      const reason = document.getElementById('cancelReasonInput').value.trim();
      if (!reason) {
        alert('Please provide a reason for cancelling.');
        return;
      }

      const evt = events.find(e => e.id === currentEditingId);
      evt.status = 'CANCELLED';
      evt.cancelReason = reason;

      // Add Firebase Firestore Cancellation Update Here:
      // await db.collection('events').doc(currentEditingId).update({ status: 'CANCELLED', cancelReason: reason });

      closeCancelModal();
      closeEditModal();
      renderTable();
    }

    // Initial Load
    renderTable();
  </script>
</body>
</html>
